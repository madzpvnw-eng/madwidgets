<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Weather</title>

    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Lucide -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Theme -->

    <link
        rel="stylesheet"
        href="../assets/css/theme.css">

    <!-- Widget -->

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <main class="weather">

        <!-- Theme Toggle -->

        <button
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Toggle Theme">

        </button>

        <!-- Title -->

        <h1 class="title">

            <i data-lucide="cloud-sun"></i>

            <span>Weather</span>

        </h1>

        <!-- Search -->

        <div class="search">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city..."
                value="Bandung">

            <button
                id="searchButton"
                aria-label="Search">

                <i data-lucide="search"></i>

            </button>

        </div>

        <!-- Weather -->

        <section class="weather-content">

            <div
                id="weatherIcon"
                class="weather-icon">

                <i data-lucide="cloud"></i>

            </div>

            <div
                id="temperature"
                class="temperature">

                --°C

            </div>

            <div
                id="description"
                class="description">

                Loading...

            </div>

            <div
                id="cityName"
                class="city">

                Bandung

            </div>

        </section>

        <!-- Refresh -->

        <button
            id="refreshButton"
            class="refresh-button">

            <i data-lucide="refresh-cw"></i>

            Refresh

        </button>

    </main>

    <!-- Theme -->

    <script src="../assets/js/theme.js"></script>

    <!-- Widget -->

    <script src="script.js"></script>

</body>

</html>
