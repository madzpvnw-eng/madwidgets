<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Progress Bar</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Lucide -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Theme -->

    <link rel="stylesheet"
          href="../assets/css/theme.css">

    <!-- Widget -->

    <link rel="stylesheet"
          href="style.css">

</head>

<body>
    <div class="widget-toolbar">
        <a href="../index.html">← MadWidgets</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Switch theme">☾</button>
    </div>


    <main class="progress-widget">
<!-- Title -->

        <h1 class="title">

            <i data-lucide="chart-no-axes-column"></i>

            <span>Progress Bar</span>

        </h1>

        <!-- Progress Name -->

        <section class="header">

            <h2 id="progressTitle">

                My Progress

            </h2>

        </section>

        <!-- Progress -->

        <section class="progress-section">

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar">

                </div>

            </div>

            <div
                id="progressPercent"
                class="percent">

                0%

            </div>

        </section>

        <!-- Information -->

        <section class="info">

            <div class="card">

                <i data-lucide="target"></i>

                <div>

                    <small>Current</small>

                    <strong id="currentValue">

                        0

                    </strong>

                </div>

            </div>

            <div class="card">

                <i data-lucide="flag"></i>

                <div>

                    <small>Target</small>

                    <strong id="targetValue">

                        100

                    </strong>

                </div>

            </div>

        </section>

        <!-- Editor -->

        <section class="editor">

            <label>

                Title

                <input
                    id="titleInput"
                    type="text"
                    placeholder="Reading Progress">

            </label>

            <label>

                Current Value

                <input
                    id="currentInput"
                    type="number"
                    min="0"
                    value="0">

            </label>

            <label>

                Target Value

                <input
                    id="targetInput"
                    type="number"
                    min="1"
                    value="100">

            </label>

            <div class="buttons">

                <button id="saveBtn">

                    Save

                </button>

                <button id="resetBtn">

                    Reset

                </button>

            </div>

        </section>

    </main>

    <!-- Theme -->


    <!-- Widget -->

    <script src="script.js"></script>

    <script src="../assets/js/theme.js"></script>
</body>

</html>
