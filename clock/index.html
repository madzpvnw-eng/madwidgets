<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Clock</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Global Theme -->

    <link rel="stylesheet"
          href="../assets/css/theme.css">

    <!-- Widget Style -->

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <main class="clock">

        <button
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Toggle Theme">

        </button>

        <div
            id="time"
            class="time">

            00:00:00

        </div>

        <div
            id="date"
            class="date">

            Monday, 1 January 2026

        </div>

    </main>

    <!-- Global Theme -->

    <script src="../assets/js/theme.js"></script>

    <!-- Widget Script -->

    <script src="script.js"></script>

</body>

</html>
