<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MadWidgets</title>

    <!-- Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Theme -->

    <link rel="stylesheet" href="assets/css/theme.css">

    <!-- Homepage -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ==========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="container">

            <div class="logo">

                <h1>MadWidgets</h1>

                <p>Beautiful Widgets for Notion</p>

            </div>

            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme">
            </button>

        </div>

    </header>

    <!-- ==========================
         MAIN
    ========================== -->

    <main class="main">

        <div class="container">

            <!-- Time -->

            <section class="category">

                <h2>Time</h2>

                <div class="widget-grid" id="time-grid"></div>

            </section>

            <!-- Productivity -->

            <section class="category">

                <h2>Productivity</h2>

                <div class="widget-grid" id="productivity-grid"></div>

            </section>

            <!-- Information -->

            <section class="category">

                <h2>Information</h2>

                <div class="widget-grid" id="information-grid"></div>

            </section>

        </div>

    </main>

    <!-- ==========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <div class="container">

            <p>
                © 2026 MadWidgets • Made with ❤️ by Mad
            </p>

        </div>

    </footer>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="assets/js/theme.js"></script>

    <script src="assets/js/widgets.js"></script>

    <script src="script.js"></script>

</body>

</html>
