<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MadWidgets • Analog Clock</title>

    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="widget-toolbar">
        <a href="../index.html">← MadWidgets</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Switch theme">☾</button>
    </div>

<div class="widget">

        <!-- ==========================
             HEADER
        ========================== -->

        <div class="header">

            <div class="clock-circle">

                <div id="hour" class="hand hour"></div>

                <div id="minute" class="hand minute"></div>

                <div id="second" class="hand second"></div>

                <div class="center-dot"></div>

            </div>

        </div>

        <!-- ==========================
             DIGITAL CLOCK
        ========================== -->

        <div class="time">

            <span id="hours">17</span>

            <span class="colon">:</span>

            <span id="minutes">00</span>

            <span class="colon">:</span>

            <span id="seconds">30</span>

        </div>

        <!-- ==========================
             DATE
        ========================== -->

        <div id="date" class="date">

            Minggu, 19 Juli 2026

        </div>

        <!-- ==========================
             DIVIDER
        ========================== -->

        <div class="divider"></div>

        <!-- ==========================
             PRAYER CARD
        ========================== -->

        <div class="prayer-card">

            <!-- Location -->

            <div class="location">
                <span class="location-icon">📍</span>
                <span id="location-name">Memuat lokasi...</span>
            </div>

            <!-- Prayer -->

            <div class="prayer-info">

                <div id="prayer-name" class="prayer-name">

                    🕌 -

                </div>

            </div>

            <!-- Countdown -->

            <div class="countdown">

                <span id="countdown">

                    -- : -- : --

                </span>

            </div>

        </div>

    </div>

<script src="script.js"></script>

    <script src="../assets/js/theme.js"></script>
</body>

</html>
