<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FFFFFF"><title>Water Tracker</title><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="../assets/css/theme.css"><link rel="stylesheet" href="style.css"></head><body><div class="widget-toolbar"><a href="../index.html">← MadWidgets</a><button class="theme-toggle" aria-label="Switch theme">☾</button></div><main class="widget"><div class="head"><div><h1 class="title">Water Tracker</h1><p class="sub">Track your daily water intake without leaving Notion.</p></div></div><div class="row"><input id="goal" class="input" type="number" min="1" value="8" style="width:110px"><span class="muted" style="align-self:center">glasses goal</span></div><div class="result"><div class="big" id="count">0 / 8</div><div class="progress"><i id="bar"></i></div><div class="tools"><button class="btn" id="add">+ 1 glass</button><button class="btn secondary" id="minus">− 1</button><button class="btn secondary" id="reset">Reset</button></div></div></main><script src="script.js"></script><script src="../assets/js/theme.js"></script></body></html>
