<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Stopwatch</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Lucide -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Theme -->

    <link rel="stylesheet"
          href="../assets/css/theme.css">

    <!-- Widget -->

    <link rel="stylesheet"
          href="style.css">

</head>

<body>
    <div class="widget-toolbar">
        <a href="../index.html">← MadWidgets</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Switch theme">☾</button>
    </div>


    <main class="stopwatch">
<!-- Title -->

        <h1 class="title">

            <i data-lucide="timer"></i>

            <span>Stopwatch</span>

        </h1>

        <!-- Time -->

        <div
            id="display"
            class="display">

            00:00:00.00

        </div>

        <!-- Controls -->

        <div class="controls">

            <button
                id="startBtn"
                class="control-btn">

                <i data-lucide="play"></i>

            </button>

            <button
                id="pauseBtn"
                class="control-btn">

                <i data-lucide="pause"></i>

            </button>

            <button
                id="resetBtn"
                class="control-btn">

                <i data-lucide="rotate-ccw"></i>

            </button>

        </div>

        <!-- Status -->

        <div
            id="status"
            class="status">

            Ready

        </div>

    </main>

    <!-- Theme -->


    <!-- Widget -->

    <script src="script.js"></script>

    <script src="../assets/js/theme.js"></script>
</body>

</html>
