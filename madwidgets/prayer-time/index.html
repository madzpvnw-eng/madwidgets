<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Prayer Time</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Lucide -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Theme -->

    <link rel="stylesheet"
          href="../assets/css/theme.css">

    <!-- Widget -->

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <main class="prayer-widget">

        <!-- Theme Toggle -->

        <button
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Toggle Theme">

        </button>

        <!-- Header -->

        <header class="header">

            <h1 class="title">

                <i data-lucide="moon-star"></i>

                <span>Prayer Time</span>

            </h1>

            <p id="location"
               class="location">

                Detecting location...

            </p>

            <p id="date"
               class="date">

                Loading date...

            </p>

        </header>

        <!-- Prayer Times -->

        <section class="prayer-list">

            <div class="prayer-item"
                 id="fajr">

                <span>Fajr</span>

                <strong>--:--</strong>

            </div>

            <div class="prayer-item"
                 id="dhuhr">

                <span>Dhuhr</span>

                <strong>--:--</strong>

            </div>

            <div class="prayer-item"
                 id="asr">

                <span>Asr</span>

                <strong>--:--</strong>

            </div>

            <div class="prayer-item"
                 id="maghrib">

                <span>Maghrib</span>

                <strong>--:--</strong>

            </div>

            <div class="prayer-item"
                 id="isha">

                <span>Isha</span>

                <strong>--:--</strong>

            </div>

        </section>

        <!-- Next Prayer -->

        <footer class="next-prayer">

            <span>Next Prayer</span>

            <strong id="nextPrayer">

                Loading...

            </strong>

        </footer>

    </main>

    <!-- Theme -->

    <script src="../assets/js/theme.js"></script>

    <!-- Widget -->

    <script src="script.js"></script>

</body>

</html>
