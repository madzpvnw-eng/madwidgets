<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pomodoro</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Lucide Icons -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Global Theme -->

    <link rel="stylesheet"
          href="../assets/css/theme.css">

    <!-- Widget Style -->

    <link rel="stylesheet"
          href="style.css">

</head>

<body>
    <div class="widget-toolbar">
        <a href="../index.html">← MadWidgets</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Switch theme">☾</button>
    </div>


    <main class="pomodoro">
<!-- Title -->

        <h1 class="title">

            <i data-lucide="timer"></i>

            <span>Focus</span>

        </h1>

        <!-- Duration -->

        <div class="duration">

            <button id="minus">

                <i data-lucide="minus"></i>

            </button>

            <span id="minutes">

                25 min

            </span>

            <button id="plus">

                <i data-lucide="plus"></i>

            </button>

        </div>

        <!-- Timer -->

        <div
            id="timer"
            class="timer">

            25:00

        </div>

        <!-- Controls -->

        <div class="controls">

            <button
                id="start"
                aria-label="Start">

                <i data-lucide="play"></i>

            </button>

            <button
                id="pause"
                aria-label="Pause">

                <i data-lucide="pause"></i>

            </button>

            <button
                id="reset"
                aria-label="Reset">

                <i data-lucide="rotate-ccw"></i>

            </button>

        </div>

    </main>

    <!-- Theme -->


    <!-- Widget -->

    <script src="script.js"></script>

    <script src="../assets/js/theme.js"></script>
</body>

</html>
